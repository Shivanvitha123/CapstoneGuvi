server:
  port: 8085

spring:
  application:
    name: CLAIMS-RECOVERY-SERVICE

  r2dbc:
    url: r2dbc:h2:mem:///claimsdb;DB_CLOSE_DELAY=-1
    username: sa
    password:

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  jackson:
    default-property-inclusion: non_null

  lifecycle:
    timeout-per-shutdown-phase: 20s

  webflux:
    multipart:
      max-in-memory-size: 10MB
      max-disk-usage-per-part: 10MB
      max-parts: 10

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: false
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}

jwt:
  secret: ${JWT_SECRET:RiskTwinNexusJwtSecretKeyForDevelopmentOnly123456789}
  expiration: 3600000

claims:
  upload-dir: uploads/claims

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics

  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    org.example.claimsrecoveryservice: INFO
    org.springframework.security: INFO
    org.springframework.r2dbc: INFO